[package]
name = "hangman"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hangman game built with Bevy"

[dependencies]
hangman-core = { path = "../hangman-core" }
bevy = { version = "0.20.1", default-features = false, features = ["2d", "ui"] }
# Same version Bevy uses; needed for the window icon type.
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
