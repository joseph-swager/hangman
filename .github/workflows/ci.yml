name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-latest,  artifact: hangman-linux-x86_64, path: target/release/hangman }
          - { name: macos,   os: macos-latest,   artifact: hangman-macos-arm64, path: dist/hangman-macos-arm64.tar.gz }
          - { name: windows, os: windows-latest, artifact: hangman-windows-x86_64, path: target/release/hangman.exe }
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release --locked -p hangman

      - name: Bundle macOS app
        if: runner.os == 'macOS'
        run: packaging/macos/bundle.sh target/release/hangman ${{ matrix.path }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package
        run: |
          cd dist
          for d in */; do
            name="${d%/}"
            if [[ "$name" == *windows* ]]; then (cd "$name" && zip -r "../$name.zip" .)
            elif [[ "$name" == *macos* ]]; then mv "$name"/*.tar.gz . # already archived Hangman.app
            else tar -czf "$name.tar.gz" -C "$name" .; fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
